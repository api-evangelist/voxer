aid: voxer
name: Voxer
description: >-
  Voxer is a San Francisco push-to-talk (PTT) communication company whose
  walkie-talkie app combines live voice, voice messaging, text, photos, video,
  and location sharing across iPhone, Android, and the web. Voxer Business
  provides secure private PTT networks for frontline teams in hospitality,
  transportation, field services, construction, and logistics, and Voxer Pro +
  AI adds AI message summaries. Voxer publishes no public REST API; its
  developer surface is a gated early-access mobile SDK (Android/iOS, with
  public API reference docs on GitHub) plus a Zapier integration. Backed by
  IVP.
