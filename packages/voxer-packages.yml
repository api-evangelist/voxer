summary: >-
  Voxer ships first-party mobile SDKs (the "Voxer SDK", announced in beta June
  2021) that embed Voxer live-audio / walkie-talkie push-to-talk into third
  party apps. Public API reference documentation for both platforms is
  published in the Voxer GitHub org (Dokka/Jazzy markdown). The SDK binaries
  are distributed through a gated early-access program (per-client appId +
  appSecret), not through public package registries: Maven Central has no
  com.rebelvox / voxersdk artifacts and CocoaPods has no VoxerSDK pod
  (verified 2026-07-21). The early-access sign-up page (get.voxer.com/sdk)
  now returns 404, so the program may be dormant.
